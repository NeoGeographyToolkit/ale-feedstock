{% set name = "ale" %}
{% set version = "1.2.0" %}
package:
  name: {{ name|lower }}
  version: {{ version }}

# ASP build: source is oleg-alexandrov/ale branch lro_nac_odtk_on_asp7 @ b8b6ea7
# = the asp_7 source (74a81fe) PLUS only the Python LRO NAC odtk fix (a single-
# valued INS<ikid>_OD_K keyword is coerced to a list, else USGSCSM cannot parse
# the lrolrocnac distortion and the camera fails to build). This deliberately
# stays on the pre-#726 ale C++ library (libale.so), byte-identical to asp_7, so
# it is binary-compatible with the shipped conda isis 10.0.0 asp_4 (built against
# the pre-#726 ale headers). asp_8 shipped the post-#726 libale under the same
# `=asp*` pin without rebuilding isis, which crashed ISIS camera loads with a heap
# corruption in ale::Orientations; asp_9 reverts the ABI while keeping the odtk
# fix. The odtk fix is Python-only, so no isis/usgscsm rebuild is needed. setup.py
# hardcodes VERSION="1.2.0" so the version stays clean 1.2.0.
source:
  git_url: https://github.com/oleg-alexandrov/ale.git
  git_rev: b8b6ea7d15d163f68b85b611b5d813fb1d0f5b34

build:
  number: 9
  string: asp_9_{{ target_platform | replace("-", "_") }}  # asp_7 source + LRO NAC odtk fix, pre-#726 ABI
  entry_points:
    - isd_generate = ale.isd_generate:main
  skip: true  # [win]

requirements:
  build:
    - python
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake >=3.15
    - make
    # ASP: pip+setuptools MUST be here in BUILD (not just host). build.sh runs
    # `pip install . --no-build-isolation` with the BUILD-env python/pip, so the
    # backend (setuptools.build_meta) must live in BUILD or pip dies with
    # "BackendUnavailable: Cannot import 'setuptools.build_meta'". Pinned down
    # because bleeding-edge pip 26 / setuptools 82 break the legacy setup.py.
    - pip <26
    - setuptools <80
  host:
    - eigen >=3,<4
    - nlohmann_json =3.11.2
    - python
    # ASP: pin pip/setuptools DOWN. Unpinned, conda pulled pip 26.1.2 +
    # setuptools 82.0.1 (bleeding edge); pip 26.x crashes internally
    # resolving the local `pip install .` of ALE's legacy setup.py. The
    # known-good combo (base env, verified building the wheel by hand) is
    # pip 24.x / setuptools 75. Build-time only - does NOT affect isis_dev's
    # runtime pip/setuptools.
    - pip <26
    - setuptools <80
  run:
    - networkx
    - {{ pin_compatible('nlohmann_json', min_pin='x.x.x', max_pin='x.x.x') }}
    - numpy
    - pvl >=1.0
    - python
    - python-dateutil
    - pytz
    - scipy >=1.4.0
    - spiceypy >=2.3.0
    - spiceql =1.3.0=asp*
    - requests
    - pyyaml
    - setuptools
    - brotli-python

test:
  requires:
    - setuptools
  imports:
    - ale
  commands:
    - test -e $PREFIX/lib/libale${SHLIB_EXT}  # [unix]
    - if not exist %LIBRARY_BIN%\ale.dll exit 1  # [win]
    - if not exist %LIBRARY_LIB%\ale.lib exit 1  # [win]
    - isd_generate --version

about:
  home: https://github.com/DOI-USGS/ale
  license: CC0-1.0
  license_file: LICENSE.md
  summary: Abstraction Library for Ephemerides (ALE) for extracting and processing planetary sensor ephemeris data.

extra:
  recipe-maintainers:
    - amystamile-usgs
    - jlaura
    - jessemapel
    - andrewannex
    - acpaquette
    - chkim-usgs
    - kelvinrr
